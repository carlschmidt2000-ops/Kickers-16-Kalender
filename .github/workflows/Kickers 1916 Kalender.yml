name: Kickers 1916 Kalender

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kalender erstellen
        run: |
          python kalender.py

      - name: Kalenderdateien prüfen
        run: |
          test -f erste.ics
          test -f zweite.ics

          echo "erste.ics:"
          wc -l erste.ics

          echo "zweite.ics:"
          wc -l zweite.ics

      - name: Public-Verzeichnis erstellen
        run: |
          rm -rf public
          mkdir -p public

          cp erste.ics public/erste.ics
          cp zweite.ics public/zweite.ics

          echo "=== Public ==="
          ls -la public

      - name: GitHub-Pages-Artefakt erstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Kalender veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
